<div id="app">
  <main id="planche" aria-label="Le plan">
    <div id="ombre" aria-hidden="true"></div>
    <svg id="svg" xmlns="http://www.w3.org/2000/svg"></svg>
    <div id="vide" class="vide" hidden>
      <div class="vide-carte">
        <div class="pictos" aria-hidden="true">
          <svg width="64" height="44" viewBox="0 0 64 44" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="8" width="18" height="28" rx="2"/><rect x="44" y="8" width="18" height="28" rx="2"/>
            <path d="M20 16h8v12h16M20 28h4"/><circle cx="20" cy="16" r="2" fill="currentColor" stroke="none"/><circle cx="44" cy="28" r="2" fill="currentColor" stroke="none"/>
          </svg>
        </div>
        <h1>Vos plans électriques, à partir de la base</h1>
        <p>Déposez un fichier Excel ou CSV n’importe où sur cette table : chaque liaison devient un fil, chaque repère un équipement, folio par folio.</p>
        <div class="vide-actions">
          <button class="btn cuivre" id="vd-ouvrir">Choisir un fichier</button>
          <button class="btn papier" id="vd-coller">Coller des liaisons</button>
          <button class="btn lien" id="vd-exemple">Voir l’exemple</button>
        </div>
      </div>
    </div>
    <div id="depot" class="depot" aria-hidden="true"><div>Déposez le fichier</div></div>
  </main>

  <header id="haut">
    <div class="marque verre" aria-label="Atelier Schéma">
      <svg viewBox="0 0 18 18" aria-hidden="true"><circle cx="3.5" cy="9" r="2.5" fill="#b5541c"/><path d="M6 9h6" stroke="#eef2f6" stroke-width="1.8" stroke-linecap="round"/><circle cx="14.5" cy="9" r="2.5" fill="#b5541c"/></svg>
      Atelier Schéma
    </div>
    <button class="dossier verre" id="dossier" title="Toutes les liaisons du contrat"><span id="ctx-nom">—</span><span id="ctx-txt"></span><span id="ctx-sauve" class="sauve"></span></button>
    <button class="btn cuivre" id="btnOuvrir" title="Ouvrir un fichier Excel ou CSV">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span>Ouvrir</span>
    </button>
    <button class="rond verre" id="btnUndo" hidden aria-label="Annuler la dernière action" title="Annuler (Ctrl+Z)">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>
    </button>
    <div class="espace"></div>
    <div class="recherche verre" id="recherche">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Repère ou n° de fil" aria-label="Chercher un repère ou un numéro de fil" autocomplete="off" spellcheck="false">
      <span class="raccourci" aria-hidden="true">/</span>
      <div id="q-liste" class="q-liste verre" role="listbox" hidden></div>
    </div>
    <div id="menuBoite">
      <button class="rond verre" id="btnMenu" aria-label="Menu" aria-haspopup="true" aria-expanded="false">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.4" fill="currentColor"/><circle cx="12" cy="12" r="1.4" fill="currentColor"/><circle cx="19" cy="12" r="1.4" fill="currentColor"/></svg>
      </button>
      <div id="menu" class="menu verre" hidden role="menu">
        <button role="menuitem" data-act="ouvrir">Ouvrir un fichier…</button>
        <button role="menuitem" data-act="coller">Coller des liaisons…</button>
        <button role="menuitem" data-act="exemple">Charger l’exemple</button>
        <hr>
        <button role="menuitem" data-act="table">Toutes les liaisons</button>
        <button role="menuitem" data-act="cartouche">Cartouche</button>
        <hr>
        <button role="menuitem" data-act="svg">Enregistrer le folio en SVG</button>
        <button role="menuitem" data-act="png">Enregistrer le folio en PNG</button>
        <button role="menuitem" data-act="imprimer">Imprimer <span class="raccourci">Ctrl+P</span></button>
        <hr>
        <button role="menuitem" data-act="vider" class="danger">Tout effacer</button>
      </div>
    </div>
  </header>

  <nav id="folios" class="verre" aria-label="Folios" hidden>
    <button id="fo-prev" aria-label="Folio précédent"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m14 6-6 6 6 6"/></svg></button>
    <div id="fo-strip" class="fo-strip"></div>
    <span id="fo-lbl" class="fo-lbl">1 / 1</span>
    <button id="fo-next" aria-label="Folio suivant"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m10 6 6 6-6 6"/></svg></button>
  </nav>

  <div id="hud" class="verre">
    <button id="zout" aria-label="Dézoomer"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h12"/></svg></button>
    <button id="zlbl" title="Ajuster le plan à l’écran (0)">100 %</button>
    <button id="zin" aria-label="Zoomer"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6v12M6 12h12"/></svg></button>
    <button id="zfit" aria-label="Ajuster à l’écran" title="Ajuster à l’écran (0)"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg></button>
  </div>

  <aside id="fiche" hidden aria-label="Fiche">
    <div class="fiche-corps" id="fiche-corps"></div>
    <div class="fiche-pied" id="fiche-pied" hidden></div>
  </aside>
  <div id="toast" class="verre" role="status" aria-live="polite"></div>
  <input type="file" id="fichier" accept=".csv,.tsv,.txt,.xlsx,.xlsm,.xls" hidden>
</div>
<div id="printroot"></div>
