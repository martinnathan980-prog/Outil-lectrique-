<!-- LA TABLE, sous tout : l'encre bleu nuit dégradée, une lumière qui respire, les points (en légère parallaxe du plan), une
     lueur qui suit la souris de loin (08-table). Leurs dessins sont des jetons de style.css ; le mouvement réduit les fige. -->
<div id="table" aria-hidden="true"><div class="ta-fond"></div><div class="ta-souffle"></div><div class="ta-points"></div><div class="ta-lueur"></div></div>
<div id="app">
  <!-- LA BARRE DU HAUT : la marque, la recherche, le menu — rien d'autre (le lecteur : le contrat, ses comptes et son
       état « ne servent à rien » ici ; ils sont dans le menu, et l'état sur le bouton des repères du rail). La marque mène
       à la bibliothèque ; à côté, un fil discret dit où l'on est — l'installation (un clic : ses plans), le plan —, rien de plus
       (08-bibliotheque, `synchroniserFil`). Sa hauteur est le jeton --entete : le plan commence dessous. -->
  <header id="entete" aria-label="Recherche et menu">
    <div class="en-contrat">
      <button type="button" class="en-volta" id="en-biblio" aria-label="Volta : la bibliothèque des installations">
        <span class="en-marque" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M5.5 7 12 17.5 18.5 7"/><circle cx="5.5" cy="5.6" r="1.9"/><circle cx="18.5" cy="5.6" r="1.9"/><circle cx="12" cy="18.6" r="1.25" fill="currentColor" stroke="none"/></svg>
        </span>
        <span class="en-nom">Volta</span>
        <span class="bulle" aria-hidden="true">Bibliothèque</span>
      </button>
      <nav class="en-fil" id="en-fil" aria-label="Où l’on est" hidden>
        <button type="button" class="en-install" id="en-install" title="Les plans de cette installation"></button>
        <span class="en-plan" id="en-plan"></span>
      </nav>
    </div>

    <!-- La recherche : toujours là, au milieu de la barre ; « / » y va, Échap en sort, la liste tombe dessous. -->
    <div class="recherche" id="recherche">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Repère, câble, part number, 300XC1:B5…" aria-label="Chercher un repère, un câble, un part number, une description ou une borne (repère:borne)" autocomplete="off" spellcheck="false">
      <kbd class="raccourci rc-ouvrir" aria-hidden="true">/</kbd>
      <kbd class="raccourci rc-fermer" aria-hidden="true">Échap</kbd>
      <!-- au doigt (pas de touche Échap) : une croix ferme la recherche -->
      <button type="button" class="rc-x" id="rc-x" aria-label="Fermer la recherche"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      <div id="q-liste" class="q-liste" role="listbox" hidden></div>
    </div>

    <div class="en-actions">
      <!-- LE RETEST CORRIGÉ, le vrai livrable : dès que le plan porte un changement, une pilule de verre le dit (« 3 changements
           · Retest corrigé ») ; un clic ouvre le relevé de ce qui part, puis l'enregistre (08-export). 08-interface la tient à
           jour (`synchroniserRetest`). -->
      <button type="button" class="en-retest" id="btnRetest" hidden aria-label="Enregistrer le retest corrigé">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8z"/><path d="M14 3v5h5M8.5 13h7M8.5 16.5h4"/><path d="m14.5 16.5 1.5 1.5 3-3"/></svg>
        <span class="en-retest-n" id="en-retest-n"></span><span class="en-retest-mot">Retest corrigé</span>
        <span class="bulle" aria-hidden="true"></span>
      </button>
      <div id="menuBoite">
        <button class="rd" id="btnMenu" aria-label="Menu" aria-haspopup="menu" aria-expanded="false">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5" r="1.4" fill="currentColor"/><circle cx="12" cy="12" r="1.4" fill="currentColor"/><circle cx="12" cy="19" r="1.4" fill="currentColor"/></svg>
          <span class="bulle" aria-hidden="true">Menu</span>
        </button>
        <div id="menu" class="menu" hidden role="menu" aria-label="Menu">
          <!-- LE MENU tient en peu de lignes (le lecteur : « il y a tellement de choses qu'on n'en utilise que 10-20 % »).
               En tête, ce qui est ouvert et son enregistrement : à lire, pas à presser. Puis l'essentiel — la bibliothèque
               (l'entrée principale : les installations et leurs plans), ouvrir un retest, vos fichiers (où l'on dépose AUSSI la
               base des contrats déjà faits), le récapitulatif, la nomenclature —, et deux sous-menus qui s'ouvrent EN PLACE
               (le menu ne s'élargit jamais) : Exporter, Plus. Chaque ligne porte sa bulle courte (data-aide), lue à gauche du
               menu, au survol ou au clavier (08-menu, `lierBullesDuMenu`). Au clavier : ↑ ↓, Entrée, → ouvre un sous-menu,
               ← ou Échap y revient (08-interface, `lierMenu`). -->
          <div class="menu-panneau" id="mp-principal" role="none">
            <div class="ctx"><div id="ctx-nom">—</div><div id="ctx-txt"></div><div id="ctx-sauve" class="sauve"></div></div>
            <div class="menu-bloc" role="group" aria-label="Les plans">
              <button role="menuitem" data-act="bibliotheque" class="menu-2l" data-aide="Vos installations et leurs plans : on choisit l’installation, puis le plan à ouvrir. Tout reste dans ce navigateur."><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/></svg><span class="menu-l">Bibliothèque<small id="mn-biblio">installations · plans</small></span></button>
              <button role="menuitem" data-act="ouvrir" data-aide="Un retest Excel ou CSV, une ligne par câble (Device1, Pin1, Device2, Pin2 au moins). Il devient un plan de l’installation ouverte ; Ctrl+Z revient en arrière."><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8z"/><path d="M14 3v5h5M12 18v-6M9.5 14.5 12 12l2.5 2.5"/></svg><span class="menu-l">Ouvrir un retest…</span><span class="raccourci">Ctrl+O</span></button>
              <button role="menuitem" data-act="fichiers" class="menu-2l" data-aide="Où déposer chaque fichier : vos retests (des plans), la base des contrats déjà faits (un seul Excel, Harness rempli), la bible, les normes."><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7.5A1.5 1.5 0 0 1 4.5 6H9l2 2h8.5A1.5 1.5 0 0 1 21 9.5v8a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 17.5z"/></svg><span class="menu-l">Vos fichiers<small>retests · base · bible · normes</small></span></button>
            </div>
            <div class="menu-bloc" role="group" aria-label="Lire et sortir">
              <button role="menuitem" data-act="recapitulatif" data-aide="Tout le plan en tableaux : liaisons, équipements, disjoncteurs, câbles, raccords, problèmes… On y corrige comme sur la fiche."><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18M3 14h18M9 5v14"/></svg><span class="menu-l">Récapitulatif</span><span class="raccourci">B</span></button>
              <button role="menuitem" data-act="nomenclature" data-aide="Ce qu’il faut commander, compté sur tout le plan : contacts, modules, connecteurs, câbles. S’enregistre en CSV."><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 6h10M10 12h10M10 18h10"/><path d="m3.5 6 1.2 1.2L7 5M3.5 12l1.2 1.2L7 11M3.5 18l1.2 1.2L7 17"/></svg><span class="menu-l">Nomenclature</span><span class="raccourci">N</span></button>
              <button role="menuitem" data-act="dejafait" data-aide="Les contrats de la base les plus proches du plan ouvert : ce qui est pareil, ce qui diffère, dessin par dessin."><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="8" height="16" rx="1.5"/><rect x="13" y="4" width="8" height="16" rx="1.5"/><path d="M6 9h2M6 13h2M16 9h2M16 13h2"/></svg><span class="menu-l">Comparer au déjà-fait</span></button>
              <button role="menuitem" data-sous="exporter" aria-haspopup="menu" aria-expanded="false" aria-controls="mp-exporter" data-aide="D’abord le retest corrigé, en Excel : ce que vous renvoyez. Puis le folio affiché (SVG, PNG, A3) et le plan entier (PDF, Visio, suivi, nomenclature)."><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7.5 10.5 12 15l4.5-4.5"/><path d="M5 19.5h14"/></svg><span class="menu-l">Exporter<small id="mn-exporter" hidden></small></span><svg class="ico menu-chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m9.5 6 6 6-6 6"/></svg></button>
            </div>
            <div class="menu-bloc" role="group" aria-label="Le reste">
              <button role="menuitem" data-sous="plus" aria-haspopup="menu" aria-expanded="false" aria-controls="mp-plus" data-aide="Coller des lignes, l’exemple, un schéma en PDF ou en Visio, la bible, les normes, les hypothèses, le cartouche, les raccourcis."><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="12" r="1.3" fill="currentColor"/><circle cx="12" cy="12" r="1.3" fill="currentColor"/><circle cx="18" cy="12" r="1.3" fill="currentColor"/></svg><span class="menu-l">Plus</span><svg class="ico menu-chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m9.5 6 6 6-6 6"/></svg></button>
            </div>
          </div>
          <!-- EXPORTER : d'abord LE RETEST CORRIGÉ — le livrable, ce que le lecteur renvoie (08-export) —, seul dans son
               groupe, son compte dessous (« 3 liaisons modifiées », 08-interface `synchroniserRetest`) ; un filet ; puis le
               folio affiché (vectoriel, image, papier) ; puis le plan entier (le dossier en PDF, le suivi, la nomenclature).
               Un module y pose ses lignes sans toucher à cette page (`entreeDuMenu`, 08-interface : le folio pour Visio…),
               dans le groupe qu'il nomme (data-groupe), ou dans un groupe à lui. -->
          <div class="menu-panneau" id="mp-exporter" role="group" aria-label="Exporter" hidden>
            <button role="menuitem" class="menu-retour" data-retour><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m14.5 6-6 6 6 6"/></svg><span class="menu-l">Exporter</span></button>
            <div class="menu-bloc menu-livrable" role="group" aria-label="Le livrable" data-groupe="retest">
              <button role="menuitem" data-act="retestcorrige" class="menu-2l" data-aide="Ce qui part dans votre retest, relu avant d’enregistrer : chaque case changée dit ce qu’elle portait, et si c’est vous ou une proposition de Volta."><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8z"/><path d="M14 3v5h5M8.5 13h7M8.5 16.5h4"/><path d="m14.5 16.5 1.5 1.5 3-3"/></svg><span class="menu-l">Le retest corrigé (Excel)<small id="mn-retest">aucune modification pour l’instant</small></span></button>
            </div>
            <div class="menu-bloc" role="group" aria-label="Le folio affiché" data-groupe="folio">
              <button role="menuitem" data-act="svg" data-aide="Le folio affiché et son cartouche, en vectoriel : net à toute échelle."><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5.5 18.5C6 11 11 6 18.5 5.5"/><rect x="3" y="17" width="4" height="4" rx="1"/><rect x="17" y="3" width="4" height="4" rx="1"/></svg><span class="menu-l">Folio en SVG</span></button>
              <button role="menuitem" data-act="png" data-aide="Le folio affiché et son cartouche, en image : pour un mail ou une présentation."><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4.5" width="18" height="15" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="m21 15.5-5-5-9 9"/></svg><span class="menu-l">Folio en PNG</span></button>
              <button role="menuitem" data-act="imprimer" data-aide="Le folio affiché, seul, sur une feuille A3 paysage."><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 9V3.5h10V9"/><rect x="3" y="9" width="18" height="8" rx="2"/><path d="M7 14h10v6.5H7z"/></svg><span class="menu-l">Imprimer</span><span class="raccourci">Ctrl+P</span></button>
            </div>
            <div class="menu-bloc" role="group" aria-label="Le plan entier" data-groupe="contrat">
              <button role="menuitem" data-act="dossierpdf" data-aide="Tous les folios en A3 avec leur cartouche, une page de garde (ce qui reste à reprendre), la nomenclature : un PDF vectoriel que Volta sait relire."><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3h8l4 4v11a1 1 0 0 1-1 1H8a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M16 3v4h4M4 7v13a1 1 0 0 0 1 1h11M10.5 11h6M10.5 14.5h6"/></svg><span class="menu-l">Le dossier en PDF (tous les folios)</span></button>
              <button role="menuitem" data-act="suivi" data-aide="Une ligne par pièce posée — barrette, prise, connecteur — avec sa référence, ses contacts et ses câbles, en CSV."><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8z"/><path d="M14 3v5h5M8.5 12.5h7M8.5 16h7"/></svg><span class="menu-l">Suivi de fabrication (CSV)</span></button>
              <button role="menuitem" data-act="nomenclaturecsv" data-aide="Ce qu’il faut commander pour tout le plan — contacts, modules, connecteurs, câbles —, en CSV, sans ouvrir la nomenclature."><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 6h10M10 12h10M10 18h10"/><path d="m3.5 6 1.2 1.2L7 5M3.5 12l1.2 1.2L7 11M3.5 18l1.2 1.2L7 17"/></svg><span class="menu-l">La nomenclature (CSV)</span></button>
            </div>
          </div>
          <!-- PLUS : sans fichier (coller, l'exemple), ce qui juge (la bible, les normes, les hypothèses), le cartouche. Plus
               de « Tout effacer » : on range, on renomme, on supprime un plan dans la bibliothèque -->
          <div class="menu-panneau" id="mp-plus" role="group" aria-label="Plus" hidden>
            <button role="menuitem" class="menu-retour" data-retour><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m14.5 6-6 6 6 6"/></svg><span class="menu-l">Plus</span></button>
            <div class="menu-bloc" role="group" aria-label="Sans fichier">
              <button role="menuitem" data-act="coller" data-aide="Sans fichier : quelques lignes copiées d’Excel, une par câble. Un aperçu, puis ajouter au plan ou le remplacer."><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="5.5" y="4.5" width="13" height="16.5" rx="2"/><path d="M9 4.5V3h6v1.5M9 10h6M9 14h6"/></svg><span class="menu-l">Coller des lignes…</span></button>
              <button role="menuitem" data-act="exemple" data-aide="Le plan de démonstration, 201 câbles sur 6 folios, tel qu’il est livré. Le vôtre reste dans la bibliothèque : Ctrl+Z le rend."><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5.5 7 12 17.5 18.5 7"/><circle cx="5.5" cy="5.6" r="1.9"/><circle cx="18.5" cy="5.6" r="1.9"/></svg><span class="menu-l">Ouvrir l’exemple</span></button>
              <!-- un PDF de schéma : la visionneuse, puis le retest que Volta en lit (08-pdf, qui pose le geste de cette ligne) -->
              <button role="menuitem" data-act="pdf" data-aide="Un schéma en PDF, exporté ou scanné : Volta le montre, lit ses liaisons (bornes, repères, cartouche) et en fait un retest à relire."><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8z"/><path d="M14 3v5h5"/><circle cx="8.8" cy="15.5" r="1.3"/><circle cx="15.2" cy="12" r="1.3"/><path d="M10 15.5h2.5v-3.5h1.5"/></svg><span class="menu-l">Lire un PDF de schéma…</span></button>
              <!-- « Lire un schéma Visio… » se pose ici, après le PDF (08-visio, `entreeDuMenu`) -->
            </div>
            <div class="menu-bloc" role="group" aria-label="Ce qui juge">
              <button role="menuitem" data-act="bible" data-aide="Les références que l’outil choisit pour chaque barrette, prise et connecteur. On peut importer la vôtre."><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4.5A2.5 2.5 0 0 1 6.5 2H20v16H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5A2.5 2.5 0 0 1 6.5 18H20v4H6.5A2.5 2.5 0 0 1 4 20.5"/></svg><span class="menu-l">Bible des barrettes</span></button>
              <button role="menuitem" data-act="normes" data-aide="Les tables qui jugent chaque câble : câbles, contacts, raccords, disjoncteurs, chute. On y cherche, on corrige une ligne."><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16M4 10h16M4 15h9M4 20h6"/><path d="m15 18 2 2 4-4"/></svg><span class="menu-l">Normes</span></button>
              <button role="menuitem" data-act="hypotheses" data-aide="Ce que le retest ne dit pas : 5 m par câble sans longueur, 2 A sans disjoncteur, 28 V… Les changer refait les calculs."><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg><span class="menu-l">Hypothèses</span></button>
              <button role="menuitem" data-act="cartouche" data-aide="Le titre, le dessinateur, la date et l’indice, écrits en bas à droite de chaque folio."><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="1.5"/><path d="M10 14h11M10 14v6M15.5 14v6"/></svg><span class="menu-l">Cartouche…</span></button>
            </div>
            <div class="menu-bloc" role="group" aria-label="Prendre en main">
              <button role="menuitem" data-act="raccourcis" data-aide="Les touches de l’outil sur une feuille : chercher, les problèmes un par un, le récapitulatif, défaire…"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="6" width="19" height="12" rx="2"/><path d="M6 10h1M9.5 10h1M13 10h1M16.5 10h1M8 14h8"/></svg><span class="menu-l">Raccourcis clavier</span><span class="raccourci">?</span></button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </header>
  <!-- LA TABLE : le plan, et rien d'autre. La feuille (le SVG du moteur) est posée dessus, son ombre dessous. -->
  <main id="planche" aria-label="Le plan">
    <div id="ombre" aria-hidden="true"></div>
    <svg id="svg" xmlns="http://www.w3.org/2000/svg"></svg>

    <!-- LE PLAN VIDE : un plan de la bibliothèque sans liaison (ses lignes effacées : Ctrl+Z, ou « Reprendre », les rend).
         Une carte posée sur la table, peu de mots, trois gestes : un retest, des lignes collées, la bibliothèque.
         08-bibliotheque relie ses boutons et dit « Reprendre » quand le dernier geste a vidé le plan. -->
    <div id="vide" class="vide" hidden>
      <div class="vd-carte" role="note" aria-labelledby="vd-titre">
        <h2 id="vd-titre">Ce plan est vide</h2>
        <p>Collez-y quelques lignes, ou ouvrez un retest : il deviendra un plan de l’installation.</p>
        <button type="button" class="vd-reprendre" id="vd-reprendre" hidden>Reprendre</button>
        <div class="vd-actions"><button class="btn cuivre" id="vd-coller">Coller des lignes</button><button class="btn papier" id="vd-ouvrir">Ouvrir un retest…</button><button class="btn lien" id="vd-bibliotheque">La bibliothèque</button></div>
      </div>
    </div>
  </main>

  <!-- LE RAIL : les outils de tous les instants, une icône chacun. Au survol prolongé (250 ms), il SE DÉPLIE (44 → 176
       px) : chaque icône suivie de son mot et de sa touche ; il se replie dès qu'on clique (08-interface, `lierRail`). Replié
       (au clavier), la bulle dit le nom et la touche (`.bulle-l`), et l'état quand il y en a un (`.bulle-s` : « 4 problèmes ·
       8 à voir », « W-012 en DR12 ») ; déplié, ce que l'outil fait (`.bulle-detail`). Défaire ↶ et refaire ↷ l'un
       sous l'autre, éteints quand il n'y a rien. Ce qu'on fait une fois (ouvrir, exporter) est dans la barre du haut et son
       menu. Sur téléphone, le rail passe en bas, replié. -->
  <nav id="rail" aria-label="Outils">
    <button class="rd bascule" id="btnBase" aria-pressed="false" aria-label="Récapitulatif (B)">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18M3 14h18M9 5v14"/></svg>
      <span class="rd-mot" aria-hidden="true">Récapitulatif</span><kbd class="rd-touche" aria-hidden="true">B</kbd>
      <span class="bulle" aria-hidden="true"><span class="bulle-l">Récapitulatif<kbd>B</kbd></span><span class="bulle-detail">Tout le plan en tableaux, corrigé sur place. Maj+B le met en page.</span></span>
    </button>
    <button class="rd bascule" id="btnIndex" aria-pressed="false" aria-label="Repères et problèmes (R)">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="4" cy="6" r="1.2" fill="currentColor"/><circle cx="4" cy="12" r="1.2" fill="currentColor"/><circle cx="4" cy="18" r="1.2" fill="currentColor"/></svg>
      <span class="rd-mot" aria-hidden="true">Repères</span><kbd class="rd-touche" aria-hidden="true">R</kbd>
      <span class="bulle" aria-hidden="true"><span class="bulle-l">Repères et problèmes<kbd>R</kbd></span><span class="bulle-s" id="bulle-index"></span><span class="bulle-detail" id="bulle-index-detail">Les repères du plan et ce qu’il y a à reprendre.</span></span>
    </button>
    <button class="rd bascule" id="btnCherche" aria-pressed="false" aria-label="Rechercher un repère, un câble, un part number (/)">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <span class="rd-mot" aria-hidden="true">Rechercher</span><kbd class="rd-touche" aria-hidden="true">/</kbd>
      <span class="bulle" aria-hidden="true"><span class="bulle-l">Rechercher<kbd>/</kbd></span><span class="bulle-detail">Un repère, un câble, un part number, une borne (300XC1:B5).</span></span>
    </button>
    <button class="rd" id="btnUndo" disabled aria-label="Défaire (Ctrl+Z)">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>
      <span class="rd-mot" aria-hidden="true">Défaire</span><kbd class="rd-touche" aria-hidden="true">Ctrl Z</kbd>
      <span class="bulle" aria-hidden="true"><span class="bulle-l">Défaire<kbd>Ctrl+Z</kbd></span><span class="bulle-s"></span><span class="bulle-detail"></span></span>
    </button>
    <button class="rd" id="btnRedo" disabled aria-label="Refaire (Ctrl+Y)">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 14 5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg>
      <span class="rd-mot" aria-hidden="true">Refaire</span><kbd class="rd-touche" aria-hidden="true">Ctrl Y</kbd>
      <span class="bulle" aria-hidden="true"><span class="bulle-l">Refaire<kbd>Ctrl+Y</kbd></span><span class="bulle-s"></span><span class="bulle-detail"></span></span>
    </button>
    <hr>
    <!-- deux bornes reliées, et un plus : le câble de la fiche, une liaison de plus -->
    <button class="rd" id="btnLiaison" aria-label="Ajouter une liaison">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="4.5" cy="16" r="2.2"/><circle cx="15.5" cy="16" r="2.2"/><path d="M6.7 16h6.6"/><path d="M19.5 3.5v6M16.5 6.5h6"/></svg>
      <span class="rd-mot" aria-hidden="true">Ajouter une liaison</span>
      <span class="bulle" aria-hidden="true"><span class="bulle-l">Ajouter une liaison</span><span class="bulle-detail">Une ligne de plus au plan, à écrire dans le récapitulatif : ses deux bouts, son câble.</span></span>
    </button>
    <!-- le symbole de la barrette (trois contacts reliés), celui de sa fiche : la bible des barrettes -->
    <button class="rd bascule" id="btnBible" aria-pressed="false" aria-label="Bible des barrettes">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="8" width="19" height="8" rx="2"/><circle cx="7" cy="12" r="1.45"/><circle cx="12" cy="12" r="1.45"/><circle cx="17" cy="12" r="1.45"/><path d="M8.45 12h2.1M13.45 12h2.1"/></svg>
      <span class="rd-mot" aria-hidden="true">Bible</span>
      <span class="bulle" aria-hidden="true"><span class="bulle-l">Bible des barrettes</span><span class="bulle-detail">Les barrettes, prises et connecteurs que l’outil sait choisir, et leurs références.</span></span>
    </button>
  </nav>

  <!-- LE BAS : tout ce qui touche à la VUE — les folios, l'affinage en cours, le dessin retouché, le cadrage, le zoom. -->
  <nav id="folios" aria-label="Vue et folios">
    <span id="fo-part" class="fo-part">
      <button class="rd" id="fo-prev" aria-label="Folio précédent (←)">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg>
        <span class="bulle" aria-hidden="true">Folio précédent<kbd>←</kbd></span>
      </button>
      <div id="fo-strip" class="fo-strip"></div>
      <button class="rd" id="fo-next" aria-label="Folio suivant (→)">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg>
        <span class="bulle" aria-hidden="true">Folio suivant<kbd>→</kbd></span>
      </button>
      <span id="fo-lbl" class="fo-lbl">1 / 1</span>
      <!-- au-delà de huit folios, une liste déroulante double la bande (l'interface la remplit) -->
      <select id="fo-select" class="fo-select" hidden aria-label="Aller à un folio"></select>
    </span>
    <span class="fo-milieu">
      <span id="affinage" class="affinage" hidden role="status" aria-live="polite"><i aria-hidden="true"></i><span id="af-txt"></span></span>
      <button class="rd auto" id="btnAuto" hidden aria-label="Folio retouché à la main : revenir au dessin automatique">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.3-5.7M4 4v4h4"/></svg>
        <span>Retouché</span>
        <span class="bulle" aria-hidden="true">Folio retouché · revenir au dessin automatique</span>
      </button>
    </span>
    <span class="fo-zoom">
      <button class="rd" id="zfit" aria-label="Ajuster le plan à l’écran (0)">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg>
        <span class="bulle" aria-hidden="true">Ajuster<kbd>0</kbd></span>
      </button>
      <hr>
      <button class="rd" id="zout" aria-label="Dézoomer (−)">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h12"/></svg>
        <span class="bulle" aria-hidden="true">Dézoomer<kbd>−</kbd></span>
      </button>
      <button class="rd zl" id="zlbl" aria-label="Échelle du plan ; ajuster à l’écran">100 %</button>
      <button class="rd" id="zin" aria-label="Zoomer (+)">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6v12M6 12h12"/></svg>
        <span class="bulle" aria-hidden="true">Zoomer<kbd>+</kbd></span>
      </button>
    </span>
  </nav>

  <!-- LA BIBLIOTHÈQUE : l'ouverture de Volta, sur la table bleu nuit. Les installations (une installation : telle antenne, tel
       cockpit…) et, dans chacune, ses plans (un plan = un retest) ; on choisit l'installation, puis le plan, qui s'ouvre sur la
       table. Elle couvre la table, le rail et les folios (le plan reste dessous, tel qu'on l'a laissé) ; les documents (vos
       fichiers, la bible, les normes) s'ouvrent à côté d'elle. 08-bibliotheque écrit tout (`rendreBibliotheque`) ; un
       fichier déposé ici devient un plan (data-depot). -->
  <section id="bibliotheque" class="biblio" data-depot="plans" aria-label="La bibliothèque des installations">
    <div class="bi-page" id="bi-page"></div>
  </section>

  <!-- L'INSPECTEUR : la fiche de ce qu'on a cliqué (un équipement, une barrette, une prise, un fil). Une CARTE qui naît du
       bloc cliqué, posée à côté de lui, qu'on déplace par sa barre ; épinglée, le volet de droite, et le plan se recadre à
       côté (08-carte). Le fil la relie à son bloc ; le quai montre où elle s'épinglera quand on la porte au bord droit. -->
  <aside id="inspecteur" hidden aria-label="Fiche de l’élément choisi">
    <div id="ba-equip" class="fi"></div>
  </aside>
  <svg id="carte-lien" aria-hidden="true"><path class="cl-trait"/><circle class="cl-bloc" r="3.5"/><circle class="cl-carte" r="3"/></svg>
  <div id="carte-quai" aria-hidden="true"><span>Épingler ici</span></div>

  <!-- LE RÉCAPITULATIF : tout le contrat en onglets (liaisons, équipements, disjoncteurs, barrettes, prises, câbles,
       contacts, raccords, problèmes, normes), corrigé sur place ; le plan suit. Trois tailles : Plan (fermé), Moitié (en
       bas, le plan au-dessus : B), Page (toute la place du plan : Maj+B) ; l'inspecteur reste à droite. 08-recap le
       remplit ; ce qui ne change pas d'un rendu à l'autre (le champ du filtre) est ici. -->
  <aside id="base" class="recap" hidden aria-label="Récapitulatif du contrat">
    <div class="poignee" id="ba-poignee" data-bulle="Glisser pour agrandir ou réduire" aria-hidden="true"></div>
    <header class="rc-tete">
      <h2 class="rc-titre">Récapitulatif</h2>
      <span class="rc-contexte" id="ba-contexte"></span>
      <span class="espace"></span>
      <div class="segment rc-taille" id="ba-taille" role="group" aria-label="Taille du récapitulatif">
        <button id="ba-fermer" data-taille="plan" aria-pressed="false" data-bulle="Le plan seul : le récapitulatif se ferme (B)">Plan</button>
        <button data-taille="moitie" aria-pressed="true" data-bulle="En bas, sous le plan qui garde son échelle (B)">Moitié</button>
        <button data-taille="page" aria-pressed="false" data-bulle="Toute la place du plan (Maj+B)">Page</button>
      </div>
      <!-- l'export dit ce qu'il sort (« Exporter 8 liaisons · folio 1 ») ; « Tout » sort tout l'onglet (08-recap, `rendreExport`) -->
      <span class="rc-export"><button class="btn papier" id="ba-csv">Exporter CSV</button><button class="btn lien" id="ba-csv-tout" hidden>Tout</button></span>
      <!-- la croix : le lecteur cherchait comment fermer — « Plan » le faisait, mais ne se lisait pas comme une sortie -->
      <button class="rond fermer" id="ba-x" aria-label="Fermer le récapitulatif (B ou Échap)" data-bulle="Fermer le récapitulatif (B)"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </header>
    <div class="rc-onglets" id="ba-onglets" role="tablist" aria-label="Ce que le récapitulatif montre"></div>
    <div class="rc-outils">
      <div class="segment ba-portee" id="ba-portee" role="group" aria-label="Lignes montrées">
        <button data-portee="folio" aria-pressed="true"><span id="ba-lib-folio">Ce folio</span><i id="ba-n-folio"></i></button>
        <button data-portee="tout" aria-pressed="false">Tout<i id="ba-n-tout"></i></button>
      </div>
      <div class="filtre rc-filtre">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="ba-filtre" placeholder="Chercher partout : repère, fil, câble, contact…" aria-label="Chercher dans l’onglet" autocomplete="off" spellcheck="false">
        <button class="vider" id="ba-vider" hidden aria-label="Effacer la recherche">×</button>
      </div>
      <div class="rc-puces" id="ba-puces" role="group" aria-label="Ne montrer que"></div>
      <div class="rc-colonnes">
        <button class="btn papier" id="ba-colonnes" aria-haspopup="true" aria-expanded="false">Colonnes<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
        <div class="rc-menu" id="ba-colonnes-menu" role="menu" hidden></div>
      </div>
      <button class="btn cuivre" id="ba-ajouter"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span id="ba-ajouter-t">Liaison</span></button>
    </div>
    <div class="ba-corps" id="ba-corps"><table class="tab rc-tab" id="ba-tab"><thead id="ba-thead"></thead><tbody id="ba-tbody"></tbody></table></div>
  </aside>

  <!-- LES DOCUMENTS rares (vos fichiers, cartouche, collage, bible, nomenclature) : à droite, à la place de l'inspecteur. -->
  <aside id="fiche" hidden aria-label="Fiche">
    <div class="fiche-corps" id="fiche-corps"></div>
    <div class="fiche-pied" id="fiche-pied" hidden></div>
  </aside>

  <!-- Le dépôt d'un fichier : toute la fenêtre devient la cible (hors de la planche, qui est un contexte d'empilement). -->
  <div id="depot" class="depot" aria-hidden="true"><div>Déposer le fichier</div></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <input type="file" id="fichier" accept=".csv,.tsv,.txt,.xlsx,.xlsm,.xls,.pdf,.vsdx,.vsdm" hidden>
  <input type="file" id="fichier-bible" accept=".csv,.tsv,.txt,.xlsx,.xlsm,.xls" hidden>
  <!-- la base des contrats déjà faits et une norme, depuis la bibliothèque et « Vos fichiers » (08-fichiers) ; des retests,
       plusieurs à la fois, qui deviennent des plans (08-bibliotheque) -->
  <input type="file" id="fichier-base" accept=".csv,.tsv,.txt,.xlsx,.xlsm,.xls" hidden>
  <input type="file" id="fichier-normes" accept=".csv,.tsv,.txt,.xlsx,.xlsm,.xls" hidden>
  <!-- l'Excel des vues de la base SEE : résumé sur place, rien n'est gardé (08-see) -->
  <input type="file" id="fichier-see" accept=".xlsx,.xlsm,.xls,.xlsb" hidden>
  <input type="file" id="fichier-plans" accept=".csv,.tsv,.txt,.xlsx,.xlsm,.xls" multiple hidden>
</div>
<div id="printroot"></div>
